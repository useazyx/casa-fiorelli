<!DOCTYPE html>

<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Reserva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
  <style>
    html {
      font-size: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f2f2f7;
      color: #333;
    }

    header {
      background: white;
      display: flex;
      justify-content: start;
      align-items: center;
      padding: 0 20px;
      flex-wrap: wrap;
    }

    .logo {
      font-weight: bold;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      margin-right: auto;
      margin-top: 0.2rem;
      margin-bottom: 0.2rem;
    }

    .logo img {
      max-width: 150px;
      max-height: 50px;
      object-fit: contain;
    }

    nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: black;
      font-size: 1rem;
    }

    .btn {
      background-color: #4caf50;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    .icone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      flex-shrink: 0;
    }

    .icone svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    main {
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .form-container,
    .contato-container {
      background: #E3DDE0;
      padding: 2rem;
      border-radius: 10px;
      width: 100%;
      max-width: 900px;
    }

    h2 {
      text-align: center;
      color: #b71c1c;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
    }

    form button.btn {
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s ease;
      display: inline-block;
      text-decoration: none;
    }

    form button.btn:hover {
      background-color: #388e3c;
    }

    .form-group {
      flex: 1 1 45%;
      display: flex;
      flex-direction: column;
    }

    .form-group input {
      padding: 0.75rem;
      border: none;
      border-radius: 20px;
      background: #d0cdcd;
    }

    .form-submit {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }

    .contato-container h3 {
      text-align: center;
      color: #b71c1c;
      margin-bottom: 1rem;
    }

    .contato-info {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: space-between;
    }

    .contato-info div {
      min-width: 200px;
    }

    .contato-info p {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

      .contato-container a {
      text-decoration: none;
      color: #333;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    @media (max-width: 768px) {
      form {
        flex-direction: column;
      }

      .form-group {
        flex: 1 1 100%;
      }

      .contato-info {
        flex-direction: column;
        gap: 1rem;
      }
    }

    nav a:not(.btn):not(:has(span)) {
      position: relative;
      display: inline-block;
      overflow: hidden;
    }

    nav a:not(.btn):not(:has(span))::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: black;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
    }

    nav a:not(.btn):not(:has(span)):hover::after {
      transform: scaleX(1);
    }

    nav a:not(.btn):not(:has(span)):not(:hover)::after {
      transform-origin: right;
    }


    .input-container {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-container input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      background: #F6F4F5;
    }

    .input-container label {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      transition: all 0.2s ease;
      pointer-events: none;
      color: #999;
    }

    .input-container input:focus+label,
    .input-container input:not(:placeholder-shown)+label {
      top: 0;
      transform: translateY(-100%);
      font-size: 12px;
      color: #7B3E19;
    }


    .input-container {
      position: relative;
      margin-bottom: 1.5rem;
      margin-left: 0.5rem;
      margin-right: 0.5rem;
    }

    .input-container textarea {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 20px;
      border: none;
      background: #F6F4F5;
      resize: vertical;
    }

    .input-container label {
      position: absolute;
      top: 10px;
      left: 15px;
      color: #999;
      pointer-events: none;
      transition: 0.2s ease all;
    }

    .input-container textarea:focus+label,
    .input-container textarea:not(:placeholder-shown)+label {
      top: -10px;
      font-size: 12px;
      color: #7B3E19;
    }


    input[type="date"],
    input[type="time"] {
      padding: 0.75rem;
      border: none;
      border-radius: 20px;
      background: #F6F4F5;
      color: #999;
      font-family: 'Inter', sans-serif;
    }

    input[type="date"]:valid,
    input[type="time"]:valid {
      color: #333;
    }

    .input-container {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-container input {
      width: 100%;
      padding: 16px 12px 8px 12px;
      font-size: 16px;
      border-radius: 20px;
      border: none;
      background: #F6F4F5;
      color: #333;
    }

    .input-container label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      background-color: transparent;
      color: #999;
      font-size: 16px;
      pointer-events: none;
      transition: 0.2s ease all;
    }

    .input-container input:focus+label,
    .input-container input:valid+label {
      top: -20px;
      font-size: 12px;
      color: #7B3E19;
      transform: none;
    }

    input::placeholder {
      color: transparent;
      transition: color 0.3s ease;
    }

    input:focus::placeholder {
      color: #999;
    }

    input:not(:placeholder-shown) {
      color: #333;
    }

    nav a.btn[href*="reserva"] {
      background: none !important;
      color: #4caf50 !important;
      border: 1px solid #4caf50 !important;
      border-radius: 25px !important;
      padding: 0.5rem 1.25rem !important;
      font-size: 1rem !important;
      cursor: pointer !important;
      transition: background-color 0.2s ease, color 0.2s ease;
      display: inline-block;
      text-decoration: none;
    }

    nav a.btn[href*="reserva"]:hover {
      background-color: #388e3c !important;
      color: white !important;
    }
  </style>
  <script src="https://unpkg.com/imask"></script>
</head>

<body>
  <header>
    <div class="logo"><img alt="Logo" src="imagens/logo.cf.ext.png" /></div>
    <nav>
      <a href="home.html">Nossa Casa</a>
      <a href="menu.html">Menu</a>
      <a href="contato.html">Contato</a>
      <a class="btn" href="reserva.html">Faça já sua reserva!</a>
      <a href="perfil.html"><span class="icone" data-icone="perfil"></span></a>
      <a href="https://www.instagram.com/casa.fiorelli/"><span class="icone" data-icone="instagram"></span></a>
      <a href="carrinho.html"><span class="icone" data-icone="carrinho"></span></a>
    </nav>
  </header>
  <main>
    <section class="form-container">
      <h2>Solicite sua Reserva!</h2>
      <form>
        <div class="form-group">
          <div class="input-container"><input placeholder=" " required="" type="text" /><label>Nome:</label></div>
        </div>
        <div class="form-group">
          <div class="input-container"><input placeholder=" " required="" type="email"
              id="email" /><label>E-mail:</label></div>
        </div>
        <div class="form-group">
          <div class="input-container"><input data-placeholder="dd/mm/aaaa" id="data" placeholder=" " required=""
              type="text" /><label style="pointer-events: none; transition: all 0.2s ease;">Data:</label></div>
        </div>
        <div class="form-group">
          <div class="input-container"><input placeholder=" " required="" type="text"
              id="telefone" /><label>Telefone:</label></div>
        </div>
        <div class="form-group">
          <div class="input-container"><input data-placeholder="--:--" id="hora" placeholder=" " required=""
              type="text" /><label style="pointer-events: none; transition: all 0.2s ease;">Horário:</label></div>
        </div>
        <div class="form-group">
          <div class="input-container"><input min="1" placeholder=" " required="" step="1" type="number" /><label>Número
              de pessoas:</label></div>
        </div>
        <div class="form-submit"><button class="btn">Enviar</button></div>
      </form>
    </section>
    <section class="contato-container">
      <h3>Outros meios de contato</h3>
      <div class="contato-info">
        <div>
          <p><span class="icone" data-icone="tel"></span>12 40028922</p>
                <p><a href="https://www.instagram.com/casa.fiorelli/"><span class="icone" data-icone="instagram"></span>
          Instagram</a></p>
      <p><a href="https://x.com/CasaFiorelli"><span class="icone" data-icone="x"></span>
          X (Twitter)</a></p>
        </div>
        <div>
          <p><span class="icone" data-icone="horas"></span>Seg a Sex<br />10:00 - 19:00</p>
          <p><span class="icone" data-icone="local"></span>Avenida Dom Pedro, 202</p>
          <p><span class="icone" data-icone="mail"></span>casa.fiorelli@gmail.com</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    document.querySelectorAll('[data-icone]').forEach(el => {
      const id = el.dataset.icone;
      const template = document.getElementById(id);
      if (template) {
        el.innerHTML = template.innerHTML;
      }
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const dateInput = document.getElementById("data");
      const timeInput = document.getElementById("hora");
      const emailInput = document.getElementById("email");
      const telefoneInput = document.getElementById("telefone");

      if (dateInput) {
        IMask(dateInput, { mask: '00/00/0000' });
      }
      if (timeInput) {
        IMask(timeInput, { mask: '00:00' });
      }
      if (telefoneInput) {
        IMask(telefoneInput, { mask: '(00) 00000-0000' });
      }
    });
  </script>

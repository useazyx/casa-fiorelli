<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir Senha</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: url('imagens/fundo.png') no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(5px);
      z-index: 0;
    }

    .reset-container {
      position: relative;
      z-index: 1;
      max-width: 400px;
      margin: 10vh auto;
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .form-group input {
      width: 100%;
      padding: 1rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: none;
      box-sizing: border-box;
    }

    .form-group label {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: white;
      padding: 0 0.25rem;
      color: #777;
      font-size: 1rem;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -0.6rem;
      left: 0.6rem;
      font-size: 0.8rem;
      color: #4caf50;
      transform: none;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-sizing: border-box;
    }

    .extra {
      text-align: center;
      margin-top: 1rem;
    }

    .extra a {
      color: #4caf50;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="reset-container">
    <h1>Redefinir Senha</h1>
    <form>
      <div class="form-group">
        <input type="email" id="email" placeholder=" " required>
        <label for="email">Informe seu e-mail</label>
      </div>
      <button type="submit" class="btn">Enviar link de redefinição</button>
      <div class="extra">
        <p>Lembrou da senha? <a href="login.html">Voltar ao login</a></p>
      </div>
    </form>
  </div>
</body>
</html>
